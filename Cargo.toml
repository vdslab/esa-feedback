[package]
name = "esa-feedback"
version = "0.1.0"
edition = "2024"
authors = ["Yosuke Onoue <onoue@likr-lab.com>"]
description = "A tool to provide LLM-generated feedback on esa.io posts"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }
google-cloud-auth = "0.13"

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pattern matching
regex = "1.10"

# Environment variables
dotenv = "0.15"

# Utilities
once_cell = "1.19"

# Testing
mockall = "0.11"
